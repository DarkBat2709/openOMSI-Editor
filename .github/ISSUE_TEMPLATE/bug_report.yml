name: Fehler melden / Bug report
description: Fehler im openOMSI-Editor melden – Deutsch oder Englisch. / Report an editor bug in German or English.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Deutsch und Englisch sind willkommen. Eine Sprache reicht!**
        **German and English are welcome. One language is enough!**

        Bitte ein Problem pro Meldung. Prüfe nach Möglichkeit die neueste Editor-Version.
        Please report one problem per issue. Try the latest editor version if possible.

  - type: checkboxes
    id: checks
    attributes:
      label: Vorher prüfen / Before submitting
      options:
        - label: Ich habe nach [vorhandenen Meldungen](https://github.com/DarkBat2709/openOMSI-Editor/issues?q=is%3Aissue) gesucht. / I searched the existing issues.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Bereich / Area
      options:
        - Start, Absturz oder graues Fenster / Startup, crash or grey window
        - Objekte und Szenerie / Objects and scenery
        - Straßen und Splines / Roads and splines
        - Kreuzungen und Kreisverkehre / Junctions and roundabouts
        - Gelände / Terrain
        - KI und Verkehrspfade / AI and traffic paths
        - Speichern und Laden / Saving and loading
        - Grafik und Leistung / Graphics and performance
        - Bedienung und Menüs / Controls and menus
        - Sonstiges / Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Was passiert? / What happens?
      description: Beschreibe den Fehler. Bilder oder Videos kannst du hier anhängen. / Describe the bug. Attach screenshots or videos here.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Fehler / Steps to reproduce
      description: Wie lässt sich der Fehler auslösen? Falls unbekannt, schreibe das dazu. / How can we reproduce it? Say if you do not know.
      placeholder: |
        1. Editor starten / Start the editor
        2. … 
        3. Fehler tritt auf / Bug occurs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten / Expected behavior
      description: Was sollte stattdessen passieren? / What should happen instead?
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Editor-Version / Editor version
      description: Bitte die genaue Editor-Version angeben. / Enter the exact editor version.
      placeholder: "z. B. / e.g. 0.8.4-pre"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Betriebssystem / Operating system
      options:
        - Windows
        - Linux
        - Sonstiges / Other
    validations:
      required: true

  - type: input
    id: operating-system-version
    attributes:
      label: Betriebssystem-Version / Operating system version
      description: "Windows: Win + R → winver. Falls unbekannt: „unbekannt“. / If unknown, enter “unknown”."
      placeholder: "z. B. / e.g. Windows 11 24H2, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: gpu-driver-details
    attributes:
      label: Grafikkarte und Treiber / Graphics card and driver
      description: NVIDIA, AMD oder Intel; Modell und Treiberversion. Falls bekannt, auch Grafik-API. / Model and driver version; graphics API if known.
      placeholder: "Grafikkarte / GPU · Treiber / Driver · Vulkan / OpenGL"
    validations:
      required: false

  - type: input
    id: map
    attributes:
      label: Betroffene Karte / Affected map
      description: Kartenname, bei Zusatzkarten gern mit Link. / Map name; add a link for custom maps if possible.
    validations:
      required: false

  - type: textarea
    id: comparison-with-other-maps
    attributes:
      label: Auch auf anderen Karten? / Also on other maps?
      description: Nenne die getesteten Karten und Ergebnisse, oder „nicht getestet“. / List tested maps and results, or “not tested”.
    validations:
      required: false

  - type: dropdown
    id: main-game-startup
    attributes:
      label: Startet das normale openOMSI-Hauptspiel? / Does the regular openOMSI game start?
      description: Besonders bei Startproblemen hilfreich. / Especially useful for startup problems.
      options:
        - Ja / Yes
        - Nein / No
        - Nicht getestet / Not tested
    validations:
      required: false

  - type: input
    id: main-game-test-version
    attributes:
      label: Getestete Hauptspiel-Version / Tested main game version
      description: Nur falls getestet. / Only if tested.
    validations:
      required: false

  - type: input
    id: worked-before
    attributes:
      label: Ging es vorher? / Did it work before?
      description: Wenn bekannt, letzte funktionierende Editor-Version nennen. / Last working editor version, if known.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logdateien / Log files
      description: |
        Bitte die vollständige game.log direkt nach dem Fehler hier anhängen oder einfügen.
        Bei Launcher-Problemen auch launcher.log. Persönliche Angaben vor dem Hochladen prüfen.
        Please attach or paste the full game.log immediately after the error.
        For launcher problems, include launcher.log too. Check for personal details before uploading.

        Windows: %USERPROFILE%\.openomsi\ · Linux: ~/.openomsi/
    validations:
      required: false
