name: Wunsch / Feature request
description: Verbesserung für den Editor vorschlagen – Deutsch oder Englisch. / Suggest an editor improvement in German or English.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Deutsch und Englisch sind willkommen. Eine Sprache reicht!**
        **German and English are welcome. One language is enough!**

        Bitte eine Idee pro Meldung. / Please submit one idea per issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Vorher prüfen / Before submitting
      options:
        - label: Ich habe nach [vorhandenen Wünschen](https://github.com/DarkBat2709/openOMSI-Editor/issues?q=is%3Aissue) gesucht. / I searched the existing issues.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Bereich / Area
      options:
        - Objekte und Szenerie / Objects and scenery
        - Straßen und Splines / Roads and splines
        - Kreuzungen und Kreisverkehre / Junctions and roundabouts
        - Gelände / Terrain
        - KI und Verkehrspfade / AI and traffic paths
        - Speichern und Laden / Saving and loading
        - Grafik und Leistung / Graphics and performance
        - Bedienung und Menüs / Controls and menus
        - Sonstiges / Other
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Was fehlt oder stört? / What is missing or difficult?
      description: Beschreibe kurz die Situation. / Briefly describe the situation.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Dein Vorschlag / Your suggestion
      description: Was soll der Editor können? Bilder kannst du hier anhängen. / What should the editor do? You can attach images here.
    validations:
      required: true

  - type: textarea
    id: omsi2
    attributes:
      label: Beispiel aus OMSI 2 oder anderen Editoren / Example from OMSI 2 or other editors
      description: Falls vorhanden, beschreibe ein Beispiel oder füge einen Link hinzu. / Describe an example or add a link, if available.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Andere Lösungen / Alternatives
      description: Hast du andere Lösungen ausprobiert? / Have you tried other solutions?
    validations:
      required: false
