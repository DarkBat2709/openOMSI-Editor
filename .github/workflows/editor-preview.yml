# Validation on editor-preview pushes and manual runs. Read-only permissions.
name: Editor preview validation
on:
  push:
    branches: [editor-preview, "update/**", "codex/editor-0.8.0-pre", "codex/editor-0.8.7-pre", "codex/windows-dxc-package-fix", "codex/editor-building-performance", "codex/editor-basis-0.3.33"]
  pull_request:
    branches: [editor-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENOMSI_VERSION: 0.3.33-editor-0.8.7-pre
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libssl-dev libwebkit2gtk-4.1-dev
      - name: Windows installer contracts
        run: python scripts/editor/test_windows_install.py
      - name: Separate Linux candidate installation
        if: runner.os == 'Linux'
        run: python scripts/editor/test_basis_0_3_33_install.py
      - name: Editor language switching
        run: python scripts/editor/test_editor_i18n.py
      - name: Default upstream configuration
        run: cargo check --workspace --locked
      - name: Standalone editor regressions
        run: cargo test --workspace --locked --no-fail-fast --features omsi-app/standalone-editor
      - name: Standalone release build
        run: cargo build --release --locked -p omsi-app --features standalone-editor
      - name: Standalone editor launcher
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo build --release --locked --manifest-path launcher/src-tauri/Cargo.toml --features standalone-editor
      - name: Portable Windows package contracts
        run: python scripts/editor/test_windows_package.py
      - name: Verified DirectX shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip'
          $expected = 'ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1'
          Invoke-WebRequest -Uri $url -OutFile dxc.zip
          if ((Get-FileHash dxc.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'DXC checksum mismatch' }
          Expand-Archive dxc.zip -DestinationPath dxc-unpacked
          New-Item -ItemType Directory -Path dxc-runtime | Out-Null
          Copy-Item dxc-unpacked/bin/x64/dxcompiler.dll, dxc-unpacked/bin/x64/dxil.dll dxc-runtime/
          Copy-Item dxc-unpacked/LICENCE-MIT.txt, dxc-unpacked/LICENSE-LLVM.txt, dxc-unpacked/LICENSE-MS.txt dxc-runtime/
      - name: DirectX 12 renderer regression
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        env:
          WGPU_BACKEND: dx12
          WGPU_DX12_COMPILER: dynamicdxc
          OMSI_NO_RT: '1'
          RUST_MIN_STACK: '33554432'
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE/dxc-runtime;$env:PATH"
          cargo test --release --locked -p omsi-render --test rt_smoke -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'DirectX 12 renderer regression failed' }
      - name: Package Windows editor
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction Stop | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw 'Visual C++ x64 redistributable runtime is missing' }
          python scripts/editor/package_windows.py --source . --binary target/release/openomsi.exe --runtime $crt.FullName --dxc dxc-runtime --output out/editor-windows --revision $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          $zip = Get-Item out/editor-windows/*.zip
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath "${env:RUNNER_TEMP}\Editor clean extraction"
          $package = Get-ChildItem "${env:RUNNER_TEMP}\Editor clean extraction" -Directory | Select-Object -First 1
          & (Join-Path $package.FullName 'openomsi.exe') --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Extracted Windows editor self-test failed' }
          & cmd.exe /d /c "`"$(Join-Path $package.FullName 'start-editor.cmd')`" --self-test"
          if ($LASTEXITCODE -ne 0) { throw 'Windows double-click starter self-test failed' }
          if (-not (Test-Path (Join-Path $package.FullName 'Content'))) { throw 'Starter did not create its content folder' }
          & (Join-Path $package.FullName 'openomsi.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Extracted Windows editor version check failed' }
      - name: Upload Windows preview package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: openOMSI-Editor-0.8.7-pre-windows-x64
          path: out/editor-windows/*
          if-no-files-found: error
          retention-days: 30
